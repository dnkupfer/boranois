<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;800&display=swap" rel="stylesheet">
<style>
  /* Share image, 1200x630. Says what the title and description don't: the promise, big. */
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#fbf7f1;font-family:Manrope,sans-serif;color:#1f2a2e}
  .blob{position:absolute;border-radius:50%;filter:blur(50px);opacity:.9}
  .b1{width:520px;height:520px;background:#ffd9c2;top:-200px;right:-120px}
  .b2{width:420px;height:420px;background:#cfeee3;bottom:-220px;left:-140px}
  .b3{width:300px;height:300px;background:#d6e6ff;bottom:-60px;right:160px}
  .in{position:absolute;inset:0;padding:64px 80px;display:flex;flex-direction:column;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:14px;font-weight:800;font-size:34px;color:#0f6b6b;letter-spacing:-.01em}
  .brand img{width:48px;height:48px}
  h1{margin:0;font-weight:800;font-size:84px;line-height:1.02;letter-spacing:-.035em;max-width:1000px}
  mark{background:linear-gradient(transparent 55%,#fff1b8 55%);color:inherit;padding:0 .08em;white-space:nowrap}
  .cta{display:inline-flex;align-items:center;gap:14px;background:#0f6b6b;color:#fff;border-radius:999px;padding:20px 32px;font-weight:800;font-size:28px;box-shadow:0 14px 36px rgba(15,107,107,.25);align-self:flex-start}
  .cta b{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:#fff;color:#0f6b6b;font-size:26px}
</style></head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="in">
    <div class="brand"><img src="favicon.svg" alt="">Boranois</div>
    <h1>Cada conversa conta. Mas <mark>com método</mark> conta mais!</h1>
    <div class="cta"><b>+</b> Influenciar uma pessoa a votar certo</div>
  </div>
</body></html>
